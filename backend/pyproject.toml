[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codebase-doctor-backend"
version = "0.1.0"
description = "Codebase Doctor - Automated Code Health, Security & Architecture Analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "sqlalchemy>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "networkx>=3.2",
    "ruff>=0.3.0",
    "bandit>=1.7.8",
    "semgrep>=1.60.0",
    "pip-audit>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["data", ".venv", "frontend", "workspaces"]

